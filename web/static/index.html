<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calTAD Annotation Tool</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <h1>calTAD Annotation Tool</h1>
        <button id="logout-btn" onclick="logout()">Logout</button>
    </header>

    <main>
        <div class="progress-bar">
            <div class="progress-stats">
                <span id="progress-complete">0/0 complete</span>
                <span id="progress-ap">AP: 0</span>
                <span id="progress-lateral">Lateral: 0</span>
            </div>
            <div class="progress-track">
                <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
            </div>
        </div>

        <div class="controls">
            <div class="control-group">
                <button class="btn-primary" onclick="showAddPatientModal()">+ Add Patient</button>
                <select id="patient-select">
                    <option value="">Select Patient...</option>
                </select>
            </div>

            <div class="control-group" id="view-controls" style="display: none;">
                <button id="btn-ap" class="view-btn active" onclick="selectView('ap')">AP View</button>
                <button id="btn-lateral" class="view-btn" onclick="selectView('lateral')">Lateral View</button>
                <label for="file-upload" class="upload-btn">Upload Image</label>
                <input type="file" id="file-upload" accept=".png,.jpg,.jpeg" style="display:none">
            </div>
        </div>

        <div class="workspace">
            <div class="canvas-container">
                <canvas id="annotation-canvas"></canvas>
                <div class="zoom-controls">
                    <button onclick="zoomIn()">+</button>
                    <button onclick="zoomOut()">-</button>
                    <button onclick="resetView()">Reset</button>
                </div>
            </div>

            <div class="sidebar">
                <div class="patient-info" id="patient-info" style="display: none;">
                    <h3>Patient</h3>
                    <div id="patient-name">-</div>
                    <div class="patient-status">
                        <span id="status-ap" class="status-badge">AP: -</span>
                        <span id="status-lateral" class="status-badge">Lateral: -</span>
                    </div>
                </div>

                <div class="landmark-info">
                    <h3>Current Landmark</h3>
                    <div id="current-landmark">
                        <span class="landmark-name">-</span>
                        <span class="landmark-progress">(0/0)</span>
                    </div>
                    <p id="landmark-description">Select a patient to begin</p>
                </div>

                <div class="landmark-list">
                    <h3>Landmarks</h3>
                    <ul id="landmarks-ul"></ul>
                </div>

                <div class="actions">
                    <button id="undo-btn" onclick="undoLast()" disabled>Undo</button>
                    <button id="save-btn" onclick="saveAnnotation()" disabled>Save</button>
                </div>

                <div class="status" id="status-message"></div>
            </div>
        </div>
    </main>

    <!-- Add Patient Modal -->
    <div id="add-patient-modal" class="modal">
        <div class="modal-content">
            <h2>Add New Patient</h2>
            <form id="add-patient-form" onsubmit="addPatient(event)">
                <label for="patient-name-input">Patient Name / ID</label>
                <input type="text" id="patient-name-input" required placeholder="e.g., Patient001 or John Doe">
                <label for="patient-notes-input">Notes (optional)</label>
                <textarea id="patient-notes-input" placeholder="Any additional notes..."></textarea>
                <div class="modal-actions">
                    <button type="button" onclick="hideAddPatientModal()">Cancel</button>
                    <button type="submit" class="btn-primary">Add Patient</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/static/annotate.js"></script>
</body>
</html>
