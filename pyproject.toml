[project]
name = "caltad"
version = "0.1.0"
description = "Automated calTAD measurement from hip X-rays"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "scikit-image>=0.21.0",
    "scipy>=1.11.0",
    "matplotlib>=3.7.0",
    "Pillow>=10.0.0",
    "pydicom>=2.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
ml = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "timm>=0.9.0",
]
web = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "python-multipart>=0.0.6",
]

[project.scripts]
caltad = "src.pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
